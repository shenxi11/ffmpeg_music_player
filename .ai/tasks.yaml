      - "Renderer/frame queue ownership avoids unsafe unlocked raw pointer peeking."
      - "Debug build succeeds after the video changes."
    notes: "Implemented stage 1. MediaSession now applies HTTP/HLS FFmpeg open options, interrupt callbacks, bounded network read deadlines, safer demux-thread shutdown before seek/close, and basic network stats. VideoDecoder converts decoded frames to YUV420P before rendering. VideoBuffer/renderer no longer use unlocked queue raw-pointer peeking. Debug VS2022 build passed with the existing VCINSTALLDIR deploy warning. Runtime HTTP/HLS smoke tests are still needed."
    updated_at: "2026-05-21 19:05"
  - task_id: "optimize-video-vlc-stage2-gpu"
    title: "Fix video close heap corruption and add D3D11VA auto decode"
    module: "video"
    owner_session: "codex/video-vlc-stage2-gpu"
    status: "review"
    depends_on:
      - "optimize-video-vlc-stage1"
    files_expected:
      - "src/video/"
    acceptance:
      - "Closing the video player during playback no longer triggers CRT heap corruption."
      - "Video frames use RAII-owned YUV plane storage instead of manual heap arrays."
      - "Renderer shutdown detaches the VideoBuffer before the MediaSession destroys it."
      - "D3D11VA hardware decode is attempted automatically and falls back to software decode."
      - "Debug build succeeds after the video changes."
    notes: "Implemented. VideoFrame now owns YUV planes through QByteArray-backed RAII storage instead of manual new[]/delete[]; renderer shutdown detaches VideoBuffer before MediaSession/VideoSession teardown; load failure also releases the partial session. VideoDecoder now attempts D3D11VA hardware decode automatically, transfers hardware frames back to software YUV for the existing OpenGL renderer, and falls back to software decode if D3D11VA init/open/get_format fails. Debug VS2022 build passed with the existing VCINSTALLDIR deploy warning. Manual close-window runtime verification is still recommended against the user-reported video."
    updated_at: "2026-05-21 22:02"
