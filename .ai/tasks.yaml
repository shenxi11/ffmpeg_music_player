    notes: "Implemented with SubAgent mode. Worker 1 handled stream/AVIO, Worker 2 handled decoder, Worker 3 handled session loading/seek state. Main agent reviewed diffs and Debug build passed. Runtime verification should use only E:/FFmpeg_whisper/ffmpeg_music_player/打印日志.txt."
    updated_at: "2026-05-19 18:55"
  - task_id: "optimize-mp3-network-seek-vlc-input-model"
    title: "Reduce MP3 network seek latency with VLC-style demux-led input model"
    module: "playback-and-audio"
    owner_session: "codex/audio-seek-vlc-multiagent"
    status: "review"
    depends_on:
      - "optimize-audio-network-vlc-parity"
    files_expected:
      - "src/audio/AudioCacheManager*"
      - "src/audio/AudioSession*"
      - "src/audio/AudioDecoder*"
      - "src/audio/stream/*"
    acceptance:
      - "Remote MP3 seek treats seek index hints as non-exact unless confidence is proven by observations."
      - "Remote MP3 seek no longer waits several seconds for decoded timestamps to naturally approach the target."
      - "A single seek does not open near-neighbor curl ranges twice when FFmpeg performs an internal AVIO correction."
      - "Only E:/FFmpeg_whisper/ffmpeg_music_player/打印日志.txt is used for runtime playback metric validation."
      - "Debug build succeeds after integration."
    notes: "Implemented with SubAgent read-only analysis and main-agent integration. Added seek request generation binding, corrected MP3 seek-index hint semantics, disabled AVIO pre-forced byte seek, changed MP3 first-packet handling to resume/rebase instead of waiting for natural timestamp catch-up, and reduced fast seek read gate. Debug build passed; fresh runtime validation should check 打印日志.txt for no forced_byte_seek on ordinary MP3 and lower SEEK_METRIC."
    updated_at: "2026-05-19 23:09"
  - task_id: "optimize-flac-network-seek-vlc-input-model"
    title: "Repair remote FLAC seek with VLC-style byte anchoring and recovery gates"
    module: "playback-and-audio"
    owner_session: "codex/flac-seek-multiagent"
    status: "review"
    depends_on:
      - "optimize-mp3-network-seek-vlc-input-model"
    files_expected:
      - "src/audio/stream/AudioAvioBridge*"
      - "src/audio/stream/AudioPrefetchStream*"
      - "src/audio/AudioDecoder*"
      - "src/audio/AudioSession*"
      - "src/audio/AudioService*"
    acceptance:
      - "Remote MP3 seek behavior remains unchanged from the accepted optimized path."
      - "Remote FLAC seek uses a target-near byte anchor instead of falling back to the file header when a non-exact hint is available."
      - "Remote FLAC seek failure leaves the player paused or recovering, never playing with an empty PCM buffer and frozen rendered position."
      - "Only E:/FFmpeg_whisper/ffmpeg_music_player/打印日志.txt is used for runtime playback validation."
      - "Debug build succeeds after integration."
    notes: "Implemented with SubAgent review and main-agent integration. Stream/AVIO now forces non-exact remote FLAC to a backed-off byte Range anchor, avoids coalescing into already-passed uncached ranges, and moves curl abort outside the stream lock. Decoder delays FLAC seek generation acceptance until the first decoded timestamp is validated and uses deadline-based first-packet waiting. Session play/resume now routes failed FLAC seek through a controlled re-seek recovery gate instead of resuming empty or wrong PCM. Debug build passed; runtime review should confirm fresh 打印日志.txt contains flac_range_reopen / flac_anchor_byte and no wrong-position FLAC resume."
    updated_at: "2026-05-20 01:17"
  - task_id: "optimize-audio-vlc-eight-parity"
